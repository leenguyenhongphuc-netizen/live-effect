name: Deploy mobile web app

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'public/overlay/key.js', 'scripts/build-mobile.js', '.github/workflows/pages.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-mobile.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mobile
      - id: deploy
        uses: actions/deploy-pages@v4
